<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style2.css">
    <title>Слайд 2</title>
</head>
<body>

    <div class=".container">
        <div class="slide-content">
            <main>
                <h3>Основа раціону</h3>
                <p class="text">
                    Щоденне вживання цільних продуктів усіх харчових груп, мінімум 400 грамів свіжих овочів та фруктів, а також підтримання водного балансу чистою водою для нормального функціонування всіх систем організму.
                </p>
            </main>
            <img class="slide" src="img/healthy_plate.jpg" alt="Здорове харчування">
        </div>
    </div>
    <div class="slider">
        <button class="nav-btn prev-btn" id="prevBtn">&#10094;</button>
        <div class="slide-counter" id="slideCounter">1 / 17</div>
        <button class="nav-btn next-btn" id="nextBtn">&#10095;</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
